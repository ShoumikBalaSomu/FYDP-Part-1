name: CI and Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  verify-python:
    name: Python ML Core, Guardrails & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch and verify public datasets
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          python scripts/fetch_datasets.py --skip-kaggle
          if [ -n "${KAGGLE_USERNAME:-}" ] && [ -n "${KAGGLE_KEY:-}" ]; then
            python scripts/fetch_datasets.py
          fi

      - name: Run Ruff lint
        run: ruff check ml_core scripts tests

      - name: Run Mypy strict type check
        run: mypy ml_core scripts tests

      - name: Run Pytest suite
        run: pytest -v

      - name: Run pip-audit CVE check
        run: pip-audit

  verify-web:
    name: Web PWA Typecheck, Vitest, Parity & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "web_app/package-lock.json"

      - name: Verify models/registry.json matches web_app/public/models/registry.json SHA-256
        run: |
          root_sha="$(sha256sum models/registry.json | awk '{print $1}')"
          web_sha="$(sha256sum web_app/public/models/registry.json | awk '{print $1}')"
          echo "models/registry.json:                ${root_sha}"
          echo "web_app/public/models/registry.json: ${web_sha}"
          if [ "${root_sha}" != "${web_sha}" ]; then
            echo "::error::Registry SHA-256 mismatch between models/ and web_app/public/models/"
            exit 1
          fi

      - name: Install web dependencies
        working-directory: web_app
        run: npm ci

      - name: TypeScript strict typecheck
        working-directory: web_app
        run: npx tsc --noEmit

      - name: Run Vitest parity and security suite
        working-directory: web_app
        run: npx vitest run

      - name: Build production PWA bundle
        working-directory: web_app
        run: npm run build

      - name: Upload built dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: somsense-web-dist
          path: web_app/dist
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web_app/dist

  deploy-pages:
    name: Deploy Static PWA to GitHub Pages
    needs: [verify-python, verify-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release-bundle:
    name: Publish Checksummed GitHub Release
    needs: [verify-python, verify-web]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built web dist artifact
        uses: actions/download-artifact@v4
        with:
          name: somsense-web-dist
          path: release_stage/web-dist

      - name: Package release archives and SHA256SUMS
        run: |
          tag="${GITHUB_REF_NAME}"
          mkdir -p release_assets
          tar -C release_stage/web-dist -czf "release_assets/somsense-${tag}-web-dist.tar.gz" .
          (cd release_stage/web-dist && zip -qr "../../release_assets/somsense-${tag}-web-dist.zip" .)
          cp models/registry.json "release_assets/somsense-${tag}-models-registry.json"
          cp models/artifacts_manifest.json "release_assets/somsense-${tag}-models-manifest.json"
          (
            cd release_assets
            sha256sum \
              "somsense-${tag}-web-dist.tar.gz" \
              "somsense-${tag}-web-dist.zip" \
              "somsense-${tag}-models-registry.json" \
              "somsense-${tag}-models-manifest.json" > SHA256SUMS
            sha256sum -c SHA256SUMS
          )

      - name: Create GitHub Release with SHA256SUMS
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release_assets/somsense-${{ github.ref_name }}-web-dist.tar.gz
            release_assets/somsense-${{ github.ref_name }}-web-dist.zip
            release_assets/somsense-${{ github.ref_name }}-models-registry.json
            release_assets/somsense-${{ github.ref_name }}-models-manifest.json
            release_assets/SHA256SUMS
          generate_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
