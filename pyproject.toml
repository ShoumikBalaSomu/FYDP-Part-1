[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "somsense-esrc"
version = "1.0.0"
description = "SOMSense (ESRC Soil Organic Matter Intelligence): calibrated SOC, SOM, and POXC estimation with conformal prediction intervals and soil physics guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "pydantic>=2.7",
  "shap>=0.46",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
  "kagglehub>=0.3",
  "nbformat>=5.10",
  "nbconvert>=7.16",
  "ipykernel>=6.29",
]

[tool.setuptools.packages.find]
include = ["ml_core*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
